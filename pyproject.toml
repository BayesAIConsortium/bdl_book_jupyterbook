[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bdl-book-jupyterbook"
version = "0.1.0"
description = "Jupyter Book 2 edition of Bayesian Deep Learning."
requires-python = ">=3.11"
dependencies = [
    "jupyter-book>=2.1,<3",
    "mystmd>=1.10,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
